<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banking Pro - PIN Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
  <header class="topbar">
    <div class="logo">Banking<span>Pro</span></div>
    <div class="tag">Secure PIN Access</div>
  </header>

  <main class="container" style="max-width: 420px;">
    <section class="card form-card">
      <h2>Enter PIN</h2>
      {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
      <form action="/pin" method="post" class="grid-form" style="grid-template-columns: 1fr;">
        <input type="password" name="pin" placeholder="Enter 4-digit PIN" required />
        <button type="submit">Unlock Dashboard</button>
      </form>
      <p class="meta">Demo PIN: <strong>1234</strong></p>
    </section>
  </main>
</body>
</html>
